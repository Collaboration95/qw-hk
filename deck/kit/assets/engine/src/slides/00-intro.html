<!-- 0 · Intro: an empty field. The first → / Space / Enter / click plays the brand reveal on this slide; the next press
     goes to slide 1. ← from slide 1 keeps the logo up; 0 or #0 shows the empty field again, ready to replay.
     Reveal (ported from the tftf launch-clip engine): the white tile springs in with a slight turn, the mark draws
     itself, then the wordmark slides out from behind the tile. ~1.4 s. Reduced motion and print: the final lockup.
     Brand: --field (slide field), --brand (tile), set on #s0. Ink is automatic: the wordmark uses --ink-auto (readable
     on --field) and the mark uses --on-brand (readable on the tile), both set by the engine. <path pathLength="1" d="M4 12V4h5"/><path pathLength="1" d="M4 12v8h5"/><path pathLength="1" d="M20 12V4h-5"/><path pathLength="1" d="M20 12v8h-5"/><path pathLength="1" d="M9 15l6-6"/> = stroke paths
     with pathLength="1" in a 24 × 24 box (use-pack --mark). Long names shrink to fit 1500 px. -->
<section class="slide" id="s0" aria-label="Product">
  <div class="row" role="img" aria-label="Product">
    <div class="brand">
      <div class="bt"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M4 12V4h5"/><path pathLength="1" d="M4 12v8h5"/><path pathLength="1" d="M20 12V4h-5"/><path pathLength="1" d="M20 12v8h-5"/><path pathLength="1" d="M9 15l6-6"/></svg></div>
      <span class="nameclip"><span>Product</span></span>
    </div>
  </div>
</section>

<style>
#s0{--field:var(--f0);--brand:#FFFFFF;--fs:170px;padding:0}
#s0 .row{position:absolute;left:0;right:0;top:50%;height:calc(var(--fs) * 1.3);margin-top:calc(var(--fs) * -.65);display:flex;justify-content:center;align-items:center;
  white-space:nowrap;font-size:var(--fs);font-weight:640;letter-spacing:-.035em;line-height:normal;color:var(--ink-auto,#fff)}
#s0 .brand{display:flex;align-items:center}
#s0 .bt{flex:none;position:relative;width:1.12em;height:1.12em;border-radius:.24em;background:var(--brand);
  box-shadow:0 .14em .34em -.12em rgba(13,19,48,.3),0 .02em .05em rgba(13,19,48,.08),inset 0 0 0 .012em rgba(255,255,255,.18);display:grid;place-items:center;font-size:1em;font-weight:800;color:var(--on-brand,#14161E)}
#s0 .bt svg{width:78%;height:78%;overflow:visible}
#s0 .bt path{fill:none;stroke:var(--on-brand,#14161E);stroke-width:1.9;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:1 1}
#s0 .nameclip{overflow:hidden;display:inline-block;padding:.08em 0 .14em;margin:-.08em 0 -.14em}
#s0 .nameclip span{display:inline-block;padding-left:.26em}
#s0 .bt{opacity:0}
#s0 .nameclip{width:0}
</style>

<script>
const el = document.getElementById('s0')
const brand = el.querySelector('.brand'), tile = el.querySelector('.bt'), clip = el.querySelector('.nameclip'), name = clip.firstElementChild
const paths = [...el.querySelectorAll('.bt path')]
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const P = (t, t0, d) => clamp((t - t0) / d)
const E = {
  expoOut: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  expoInOut: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  cubicInOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
}
const spring = (s, k = 210, c = 21) => {
  if (s <= 0) return 0
  const w0 = Math.sqrt(k), z = c / (2 * w0), wd = w0 * Math.sqrt(1 - z * z)
  return 1 - Math.exp(-z * w0 * s) * (Math.cos(wd * s) + (z * w0 / wd) * Math.sin(wd * s))
}
const draw = (p, v) => { p.style.strokeDashoffset = 1 - v; p.style.opacity = v > 0.015 ? 1 : 0 }
const AT = -0.28, TI = 0, NM = 0.46, PUSH = 2, END = 2.2
let nameW = 0
const pose = t => {
  const s = spring(t - TI)
  tile.style.opacity = P(t, TI, 0.16)
  tile.style.transform = `scale(${0.55 + 0.45 * s}) rotate(${(1 - s) * -8}deg)`
  const last = paths.length - 1
  paths.forEach((p, i) => draw(p, i < last || paths.length === 1 ? E.cubicInOut(P(t, TI + 0.06, 0.42)) : E.expoOut(P(t, TI + 0.42, 0.32))))
  const pn = E.expoInOut(P(t, NM, 0.7))
  clip.style.width = pn >= 1 ? 'auto' : (pn * nameW) + 'px'
  name.style.transform = pn >= 1 ? 'none' : `translateX(${-(1 - pn) * 0.45 * nameW}px)`
  name.style.opacity = Math.pow(pn, 0.6)
  brand.style.transform = `scale(${1 + 0.018 * E.cubicInOut(P(t, AT, PUSH))})`
}
let raf = 0, played = false
const fitName = () => { const max = 1500, w = brand.scrollWidth; if (w > max) el.style.setProperty('--fs', (170 * max / w).toFixed(1) + 'px') }
const show = mode => {
  cancelAnimationFrame(raf)
  played = mode !== 'empty'
  if (mode !== 'play') return pose(mode === 'done' ? END : -1)
  nameW = name.offsetWidth
  const t0 = performance.now()
  const tick = () => { const t = (performance.now() - t0) / 1000; pose(t); if (t < END) raf = requestAnimationFrame(tick) }
  pose(0); raf = requestAnimationFrame(tick)
}
pose(-1)
clip.style.width = 'auto'; fitName(); clip.style.width = ''
document.fonts?.ready.then(() => { clip.style.width = 'auto'; el.style.removeProperty('--fs'); fitName(); clip.style.width = ''; if (played) pose(END) })
Deck.on('s0', {
  steps: 1,
  set: (n, ctx) => show(n ? (ctx.animate ? 'play' : 'done') : 'empty'),
  enter: (_, ctx) => { if (ctx.from === 1) show('done') },
  next: () => { if (!played) { Deck.step('s0', 1); return true } },
  final: () => show('done'),
})
</script>
