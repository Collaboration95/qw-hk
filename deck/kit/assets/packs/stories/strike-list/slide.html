<style>
#s__N__{--field:linear-gradient(180deg,#A63E2B 0%,#BF5137 55%,#CC6242 100%);--brand:var(--deck-brand,#2B2F45);--brand-2:var(--deck-brand-2,#FFC83D);color:var(--ink-auto,#fff);padding:96px 100px;--ink-pen:var(--ink-auto,#fff)}

#s__N__::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 600px at 82% 10%,color-mix(in oklab,var(--ink-auto,#fff) 12%,transparent),transparent 70%)}

#s__N__ .st-strike-list-desk{position:absolute;inset:0;width:1920px;height:1080px;z-index:-1;pointer-events:none}

#s__N__ .st-strike-list-before{position:absolute;left:100px;top:340px;width:700px;height:600px;padding:52px 56px;border-radius:30px;
  display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-2.5deg) translateY(6px);

#s__N__ .st-strike-list-row{position:relative;display:flex;align-items:center;gap:26px;width:max-content}
#s__N__ .st-strike-list-glyph,#s__N__ .st-strike-list-word{opacity:.42;transform:translateY(2px)}
#s__N__ .st-strike-list-glyph{width:76px;height:76px;flex:none;fill:none;stroke:var(--ink-auto,#fff);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}

#s__N__ .st-strike-list-pen{position:absolute;top:50%;left:calc(100% + 26px);width:150px;height:40px;margin:-38px 0 0 -6px;opacity:0;transform-origin:4px 20px;transform:rotate(-38deg) translate(10px,-6px)}

#s__N__ .st-strike-list-arrow{position:absolute;left:826px;top:600px;width:170px;height:80px;overflow:visible}

#s__N__ .st-strike-list-slot{position:absolute;left:1010px;top:330px;width:810px;height:620px;border-radius:32px;border:4px dashed color-mix(in oklab,var(--ink-auto,#fff) 40%,transparent)}
