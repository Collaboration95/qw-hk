<!-- Story · balance: cost vs value. A beam scale is tipped by a heavy iron weight ($2,400) in the cost pan; the
     weight slides off and lands on the floor with a thud, a small coin ($24) drops into the pan, clinks and bounces,
     and the beam swings over to the value side (a gem on a cushion), overshoots and settles; the pans swing on
     their strings, their shadows on the floor grow and shrink with their height. ~1.45 s: svg + a small spring
     simulation run once per forward arrival. The markup is the final pose (print, reduced motion, ←).
     Re-skin: the weight and coin carry the product's real before → after cost; the gem is what the buyer gets
     (swap for a parcel, a report, a trophy). Copy: rewrite the h2 and the two prices. -->
<section class="slide" id="s__N__">
  <h2 class="st-balance-h">The same result<br>for a hundredth of the cost.</h2>

  <svg class="st-balance-svg" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <radialGradient id="st-balance-spot-__N__" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFFBEA" stop-opacity=".55"/><stop offset=".6" stop-color="#FFFBEA" stop-opacity="0"/></radialGradient>
      
      <linearGradient id="st-balance-iron-__N__" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in oklab,var(--st-balance-iron) 80%,#fff)"/><stop offset="1" style="stop-color:var(--st-balance-iron)"/></linearGradient>
      <linearGradient id="st-balance-wood-__N__" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in oklab,var(--st-balance-wood) 82%,#fff)"/><stop offset="1" style="stop-color:var(--st-balance-wood)"/></linearGradient>
      <linearGradient id="st-balance-dish-__N__" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#EFE3C6"/></linearGradient>
      <linearGradient id="st-balance-gemfill-__N__" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:color-mix(in oklab,var(--brand) 45%,#fff)"/><stop offset=".55" style="stop-color:var(--brand)"/><stop offset="1" style="stop-color:color-mix(in oklab,var(--brand) 62%,#000)"/></linearGradient>
      <clipPath id="st-balance-gemclip-__N__"><path d="M-46-104h92l34 30-80 74-80-74z"/></clipPath>
    </defs>
    <ellipse cx="960" cy="140" rx="900" ry="720" fill="url(#st-balance-spot-__N__)"/>
    <rect x="0" y="930" width="1920" height="150" style="fill:color-mix(in oklab,var(--ink-auto,#14161E) 9%,transparent)"/>
    <path d="M0 930H1920" style="stroke:color-mix(in oklab,var(--ink-auto,#14161E) 26%,transparent)" stroke-width="3"/>

    <!-- floor shadows: they grow and darken as a pan comes down -->
    <ellipse class="st-balance-shl" cx="463.8" cy="968" rx="134" ry="14" fill="#000" opacity=".1"/>
    <ellipse class="st-balance-shr" cx="1448.6" cy="968" rx="181" ry="18" fill="#000" opacity=".25"/>
    <ellipse cx="960" cy="964" rx="230" ry="16" fill="#000" opacity=".22"/>
    <ellipse class="st-balance-shw" cx="250" cy="962" rx="110" ry="12" fill="#000" opacity=".3"/>

    <!-- the stand: foot, post, a dial behind the pivot -->
    <g class="st-balance-base">
      <path d="M780 962c0-30 30-50 70-56h220c40 6 70 26 70 56z" fill="url(#st-balance-wood-__N__)"/>
      <path d="M800 930c10-12 30-20 52-22h216c22 2 42 10 52 22" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="4"/>
      <rect x="944" y="476" width="32" height="432" rx="10" fill="url(#st-balance-wood-__N__)"/>
      <rect x="950" y="482" width="6" height="420" rx="3" fill="#fff" opacity=".13"/>
      <path d="M836 470a124 124 0 0 1 248 0z" fill="#FFF9EC" class="st-balance-ln" stroke-width="5"/>
      <g stroke="#2C1D10" stroke-width="3.5" stroke-linecap="round"><path d="M901.0 367.8L912.0 386.9"/><path d="M910.1 363.1L916.0 375.7"/><path d="M919.6 359.1L927.2 379.8"/><path d="M929.5 356.0L933.1 369.5"/><path d="M939.5 353.8L943.3 375.5"/><path d="M949.7 352.4L950.9 366.4"/><path d="M960.0 352.0L960.0 374.0"/><path d="M970.3 352.4L969.1 366.4"/><path d="M980.5 353.8L976.7 375.5"/><path d="M990.5 356.0L986.9 369.5"/><path d="M1000.4 359.1L992.8 379.8"/><path d="M1009.9 363.1L1004.0 375.7"/><path d="M1019.0 367.8L1008.0 386.9"/></g>
    </g>

    <!-- the beam (rotates about the pivot), with its needle -->
    <g class="st-balance-beam" transform="rotate(10 960 470)">
      <path d="M960 470L960 366" class="st-balance-needle" stroke-width="6" stroke-linecap="round"/>
      <rect x="450" y="458" width="1020" height="24" rx="12" fill="url(#st-balance-wood-__N__)"/>
      <rect x="470" y="461" width="980" height="5" rx="2.5" fill="#fff" opacity=".16"/>
      <circle cx="460" cy="470" r="20" class="st-balance-lnf"/><circle cx="1460" cy="470" r="20" class="st-balance-lnf"/>
      <circle cx="460" cy="470" r="8" class="st-balance-brass"/><circle cx="1460" cy="470" r="8" class="st-balance-brass"/>
      <circle cx="960" cy="470" r="22" class="st-balance-lnf"/><circle cx="960" cy="470" r="9" class="st-balance-brass"/>
    </g>

    <!-- the cost pan: the coin lives here; the iron weight starts here -->
    <g class="st-balance-panl" transform="translate(463.8 404.8)">
      <circle cx="0" cy="0" r="9" fill="none" class="st-balance-ln" stroke-width="5"/>
      <path d="M0 6L-138 204M0 6L138 204M0 6V200" class="st-balance-ln" stroke-width="3" fill="none"/>
      <g class="st-balance-coin" transform="translate(0 208)">
        <ellipse class="st-balance-clink" cx="0" cy="0" rx="48" ry="9" fill="none" stroke="#fff" stroke-width="3" opacity="0"/>
        <g class="st-balance-coinface">
          <circle cx="0" cy="-46" r="46" fill="#F7C948" stroke="#A9750C" stroke-width="5"/>
          <circle cx="0" cy="-46" r="35" fill="none" stroke="#D9A21E" stroke-width="2.5"/>
          <text x="0" y="-35" text-anchor="middle" class="st-balance-coint">$24</text>
          <path d="M-27-70a37 37 0 0 1 27-12" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".7"/>
        </g>
      </g>
      <path d="M-152 204Q0 290 152 204" fill="url(#st-balance-dish-__N__)" class="st-balance-ln" stroke-width="5"/>
      <ellipse cx="0" cy="204" rx="152" ry="16" fill="#FFFDF6" class="st-balance-ln" stroke-width="5"/>
    </g>

    <!-- the value pan: a gem on a velvet cushion -->
    <g class="st-balance-panr" transform="translate(1448.6 578.5)">
      <circle cx="0" cy="0" r="9" fill="none" class="st-balance-ln" stroke-width="5"/>
      <path d="M0 6L-138 204M0 6L138 204M0 6V178" class="st-balance-ln" stroke-width="3" fill="none"/>
      <path d="M-152 204Q0 290 152 204" fill="url(#st-balance-dish-__N__)" class="st-balance-ln" stroke-width="5"/>
      <ellipse cx="0" cy="204" rx="152" ry="16" fill="#FFFDF6" class="st-balance-ln" stroke-width="5"/>
      <g class="st-balance-cushion"><rect x="-96" y="176" width="192" height="40" rx="20" style="fill:color-mix(in oklab,var(--brand-2) 70%,#2A1030)"/><path d="M-78 186h156" stroke="#fff" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/></g>
      <g class="st-balance-gem" transform="translate(0 182)">
        <path d="M-46-104h92l34 30-80 74-80-74z" fill="url(#st-balance-gemfill-__N__)" style="stroke:color-mix(in oklab,var(--brand) 45%,#000)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-80-74h160M-46-104l-14 30 60 74 60-74-14-30M-60-74l60 74M0-104l-20 30h40z" style="stroke:color-mix(in oklab,var(--brand) 45%,#000)" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
        <g clip-path="url(#st-balance-gemclip-__N__)"><rect class="st-balance-glint" x="-130" y="-130" width="30" height="180" fill="#fff" opacity="0"/></g>
      </g>
    </g>

    <!-- the old iron weight: rests on the floor where it fell -->
    <g class="st-balance-weight" transform="translate(250 958)">
      <path d="M-84 0L-64-112h128L84 0z" fill="url(#st-balance-iron-__N__)" class="st-balance-ln" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-30-112a30 30 0 0 1 60 0" fill="none" style="stroke:var(--st-balance-iron)" stroke-width="16"/>
      <path d="M-58-100h116" stroke="#fff" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="-38" text-anchor="middle" class="st-balance-wt">$2,400</text>
    </g>
    <g class="st-balance-dust" opacity="0"><circle cx="150" cy="950" r="16"/><circle cx="176" cy="934" r="10"/><circle cx="350" cy="950" r="16"/><circle cx="326" cy="932" r="11"/></g>
  </svg>
</section>

<style>
#s__N__{--field:linear-gradient(180deg,#F6CB55 0%,#EEB940 60%,#E5A931 100%);--brand:var(--deck-brand,#17A9A0);--brand-2:var(--deck-brand-2,#C2362B);color:var(--ink-auto,#14161E);padding:96px 100px;
  /* the scale is drawn in the field's own ink: dark wood on a light field, pale ash on a dark one */
  --st-balance-wood:color-mix(in oklab,var(--ink-auto,#14161E) 84%,#7A5530);--st-balance-iron:color-mix(in oklab,var(--ink-auto,#14161E) 84%,#5F5A57)}
#s__N__ .st-balance-ln{stroke:var(--st-balance-wood)}
#s__N__ .st-balance-lnf{fill:var(--st-balance-wood)}
#s__N__ .st-balance-needle{stroke:color-mix(in oklab,var(--brand-2) 78%,#14161E)}
#s__N__ .st-balance-brass{fill:color-mix(in oklab,var(--brand-2) 40%,#E7B54A)}
#s__N__ .st-balance-h{position:relative;z-index:1;font-size:96px;letter-spacing:-.045em;line-height:1.04}
#s__N__ .st-balance-svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
#s__N__ .st-balance-coint{font:800 31px/1 var(--f);letter-spacing:-.03em;fill:#6B4A05}
#s__N__ .st-balance-wt{font:800 36px/1 var(--f);letter-spacing:-.03em;fill:var(--st-balance-inv,#F6E7C8)}
#s__N__ .st-balance-dust circle{fill:color-mix(in oklab,var(--ink-auto,#14161E) 18%,transparent);stroke:color-mix(in oklab,var(--ink-auto,#14161E) 30%,transparent);stroke-width:3}
/* the gem catches the light once the scale has settled */
#s__N__ .st-balance-glint{transform-box:fill-box;transform:skewX(-22deg)}
#s__N__.play .st-balance-glint{animation:st-balance-glint .42s ease-in-out 1.12s backwards}
@keyframes st-balance-glint{0%{opacity:.9;transform:skewX(-22deg) translateX(0)}100%{opacity:.9;transform:skewX(-22deg) translateX(260px)}}
</style>

<script>
const el = document.getElementById('s__N__')
const q = s => el.querySelector(s)
const beam = q('.st-balance-beam'), panL = q('.st-balance-panl'), panR = q('.st-balance-panr'), coin = q('.st-balance-coin'), face = q('.st-balance-coinface'), clink = q('.st-balance-clink')
const weight = q('.st-balance-weight'), shL = q('.st-balance-shl'), shR = q('.st-balance-shr'), shW = q('.st-balance-shw'), base = q('.st-balance-base'), dust = q('.st-balance-dust'), cushion = q('.st-balance-cushion')
{ const ink = Deck.inkOn(getComputedStyle(el).getPropertyValue('--field')) || '#14161E'; el.style.setProperty('--st-balance-inv', ink === '#FFFFFF' ? '#14161E' : '#F6E7C8') }
const P = [960, 470], L = 500, HK = 22, T0 = -14, T1 = 10, END = 1.5, LEAVE = .2, COIN = .5, LAND = .46
const rad = d => d * Math.PI / 180, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const hook = (th, side) => { const t = rad(th), x = side * L; return [P[0] + x * Math.cos(t) - HK * Math.sin(t), P[1] + x * Math.sin(t) + HK * Math.cos(t)] }
// one deterministic run of the beam spring and the two pan pendulums, sampled at 240 Hz
const DT = 1 / 240, sim = []
{
  let th = T0, w = 0, pl = 0, vl = 0, pr = 0, vr = 0
  for (let i = 0; i * DT <= END + .05; i++) {
    const t = i * DT, target = t < LEAVE ? T0 : T1
    const a = -64 * (th - target) - 7.6 * w
    w += a * DT; if (Math.abs(t - COIN) < DT / 2) w -= 26        /* the coin lands: the beam dips a hair */
    th += w * DT
    if (Math.abs(t - LEAVE) < DT / 2) vl += 70                    /* the weight slides off: the cost pan kicks */
    vl += (-52 * pl - 3.4 * vl - .42 * a) * DT; pl += vl * DT
    vr += (-46 * pr - 3.0 * vr - .38 * a) * DT; pr += vr * DT
    sim.push([th, pl, pr])
  }
}
const cube = p => p * p * p
const setT = (g, x, y, r = 0, sx = 1, sy = 1) => g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`)
const shadow = (e, x, dishY) => { const h = clamp((dishY - 560) / 300); e.setAttribute('cx', x.toFixed(1)); e.setAttribute('rx', (120 + 80 * h).toFixed(1)); e.setAttribute('ry', (12 + 8 * h).toFixed(1)); e.setAttribute('opacity', (.1 + .2 * h).toFixed(3)) }
const pose = t => {
  const done = t >= END, [th, pl, pr] = done ? [T1, 0, 0] : sim[Math.min(sim.length - 1, Math.round(t / DT))]
  beam.setAttribute('transform', `rotate(${th.toFixed(2)} 960 470)`)
  const hl = hook(th, -1), hr = hook(th, 1)
  setT(panL, hl[0], hl[1], pl); setT(panR, hr[0], hr[1], pr)
  shadow(shL, hl[0], hl[1] + 205); shadow(shR, hr[0], hr[1] + 205)
  // the weight: in the pan, then slides off to the left and drops; thud at LAND; rests on the floor
  if (!done && t < .08) { setT(weight, hl[0] - 208 * Math.sin(rad(pl)), hl[1] + 208 * Math.cos(rad(pl)), pl); shW.setAttribute('opacity', 0) }
  else if (!done && t < LAND) {
    const p = cube((t - .08) / (LAND - .08)) * .7 + .3 * ((t - .08) / (LAND - .08)), s0 = hook(T0, -1), a = [s0[0], s0[1] + 208], c = [a[0] - 190, a[1] - 4], b = [250, 958]
    const x = (1 - p) * (1 - p) * a[0] + 2 * p * (1 - p) * c[0] + p * p * b[0], y = (1 - p) * (1 - p) * a[1] + 2 * p * (1 - p) * c[1] + p * p * b[1]
    setT(weight, x, y, -24 * Math.sin(Math.PI * p)); shW.setAttribute('opacity', (.3 * p).toFixed(3))
  } else {
    const k = done ? 1 : clamp((t - LAND) / .22), sq = Math.sin(Math.PI * k) * (1 - k) * .2
    setT(weight, 250, 958, 0, 1 + sq * .6, 1 - sq); shW.setAttribute('opacity', .3)
  }
  const dk = clamp((t - LAND) / .4)
  dust.setAttribute('opacity', t < LAND || done ? 0 : (1 - dk).toFixed(3))
  dust.setAttribute('transform', `translate(250 950) scale(${(1 + dk * .9).toFixed(3)}) translate(-250 -950)`)
  base.setAttribute('transform', !done && t > LAND && t < LAND + .14 ? `translate(0 ${(3 * Math.sin((t - LAND) / .14 * Math.PI * 2) * (1 - (t - LAND) / .14)).toFixed(2)})` : '')
  // the coin: drops in spinning, clinks, bounces twice, stands
  let cy = 208, sx = 1
  if (!done && t < .3) cy = -900
  else if (!done && t < COIN) { const p = (t - .3) / (COIN - .3); cy = 208 - 300 * (1 - p * p); sx = Math.max(.12, Math.abs(Math.cos(p * Math.PI * 3.5))) }
  else if (!done && t < .76) { const b = t < .65 ? [COIN, .65, 36] : [.65, .76, 10], p = (t - b[0]) / (b[1] - b[0]); cy = 208 - b[2] * 4 * p * (1 - p) }
  face.style.opacity = !done && t < COIN ? Math.min(1, (t - .3) / .06) : 1
  coin.setAttribute('transform', `translate(0 ${cy.toFixed(1)})`); face.setAttribute('transform', `scale(${sx.toFixed(3)} 1)`)
  const ck = clamp((t - COIN) / .3)
  clink.setAttribute('opacity', t < COIN || done ? 0 : ((1 - ck) * .95).toFixed(3)); clink.setAttribute('transform', `translate(0 ${(-cy + 208).toFixed(1)}) scale(${(1 + ck * 1.3).toFixed(3)})`)
  // the cushion gives a little as the value pan swings down
  const cu = done ? 0 : Math.max(0, Math.sin(clamp((t - .35) / .5) * Math.PI)) * .1
  cushion.setAttribute('transform', `translate(0 ${(216 * cu).toFixed(1)}) scale(1 ${(1 - cu).toFixed(3)})`)
}
let raf = 0
const play = () => { cancelAnimationFrame(raf); const t0 = performance.now(); const tick = () => { const t = (performance.now() - t0) / 1000; pose(t); if (t < END) raf = requestAnimationFrame(tick) }; pose(0); raf = requestAnimationFrame(tick) }
const rest = () => { cancelAnimationFrame(raf); pose(END) }
Deck.on('s__N__', { enter: (_, ctx) => ctx.play ? play() : rest(), leave: rest, final: rest })
rest()
</script>
