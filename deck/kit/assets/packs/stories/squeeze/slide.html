<!-- Story · squeeze: a tall, messy stack of records slides onto the bed of a press; the platen comes down, the
     hand wheel spins, the stack is squared up and squeezed into one thin block; the excess puffs out of both sides
     as dust and a few paper scraps that stay where they fall. Beside it the size counts down 48 → 3 and the old
     number lands struck above it. ~1.3 s, CSS + the engine's .count, then rests (the resting CSS is the final pose).
     Re-skin: the sheets' colours and tabs are the product's records (pages, photos, logs, layers); the number and
     unit are its real before → after. Copy: rewrite the h2 and the numbers (data-from, data-to, the struck line). -->

          <g class="st-squeeze-sheet" style="--i:9;--jx:-11px;--r:-0.85deg"><rect class="st-squeeze-face" x="360" y="303" width="360" height="19" rx="4" style="fill:color-mix(in oklab,var(--brand) 18%,#fff)"/><rect class="st-squeeze-face" x="360" y="318" width="360" height="4" rx="2" fill="#1E3A33" opacity=".14"/><rect x="384" y="310" width="127" height="4" rx="2" fill="#1E3A33" opacity=".12"/></g>

      <g class="st-squeeze-strap st-squeeze-t2"><rect x="620" y="440" width="22" height="84" rx="5" class="st-squeeze-strapf" stroke-width="2.5"/><rect x="624" y="476" width="14" height="10" rx="2" class="st-squeeze-strapd"/></g>

      <g class="st-squeeze-bed">

  </div>

<style>
#s__N__{--field:linear-gradient(180deg,#0F4D41 0%,#156450 55%,#0E4438 100%);--brand:var(--deck-brand,#F2B544);--brand-2:var(--deck-brand-2,#FF8A65);color:var(--ink-auto,#fff);padding:96px 100px;
  --st-squeeze-brass:color-mix(in oklab,var(--brand) 78%,#fff)}
/* pegboard and a soft lamp pool: drawn from the ink, so they sit on any field */
#s__N__ .st-squeeze-peg{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1100px 650px at 30% 34%,color-mix(in oklab,var(--ink-auto,#fff) 9%,transparent),transparent 70%),radial-gradient(circle,color-mix(in oklab,var(--ink-auto,#fff) 9%,transparent) 2.6px,transparent 3.2px) 22px 22px/44px 44px}
#s__N__ .st-squeeze-brass-s{stroke:var(--st-squeeze-brass)}
#s__N__ .st-squeeze-brass-f{fill:var(--st-squeeze-brass)}
#s__N__ .st-squeeze-brass-d{stroke:color-mix(in oklab,var(--brand) 60%,#000)}
#s__N__ .st-squeeze-brass-df{fill:color-mix(in oklab,var(--brand) 60%,#000)}
#s__N__ .st-squeeze-strapf{fill:var(--brand);stroke:color-mix(in oklab,var(--brand) 55%,#000)}
#s__N__ .st-squeeze-strapd{fill:color-mix(in oklab,var(--brand) 55%,#000)}
#s__N__ .st-squeeze-mark{fill:none;stroke:#22302B;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#s__N__ .st-squeeze-h{font-size:96px;letter-spacing:-.045em;line-height:1.04}

/* the stage: a warm cream card lit from above, with an inner highlight and a deep green shadow */
#s__N__ .st-squeeze-card{position:absolute;left:100px;top:380px;width:1080px;height:620px;border-radius:34px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in oklab,var(--brand) 5%,#FBF6EC) 0%,color-mix(in oklab,var(--brand) 9%,#F1E8D6) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -3px 0 rgba(120,90,30,.08) inset,0 2px 4px rgba(0,0,0,.2),0 50px 90px -40px rgba(0,0,0,.7)}
#s__N__ .st-squeeze-svg{display:block}
#s__N__ .st-squeeze-svg *{transform-box:fill-box}
#s__N__ .st-squeeze-dust circle{fill:#D3C29C;stroke:#FFF9EC;stroke-width:3}

/* the number: the old size struck above, the new size big, level with the block */
#s__N__ .st-squeeze-num{position:absolute;left:1260px;top:520px;width:560px}
#s__N__ .st-squeeze-was{font:700 64px/1 var(--f);letter-spacing:-.03em;color:color-mix(in oklab,var(--ink-auto,#fff) 62%,transparent)}
#s__N__ .st-squeeze-was .strike{background-size:100% 6px;padding:0 4px;opacity:1}
#s__N__ .st-squeeze-now{margin-top:20px;display:flex;align-items:baseline;gap:18px;white-space:nowrap}
#s__N__ .st-squeeze-big{display:inline-block;font:800 300px/.8 var(--f);letter-spacing:-.06em;font-variant-numeric:tabular-nums;transform-origin:50% 100%}
#s__N__ .st-squeeze-unit{font:800 96px/1 var(--f);letter-spacing:-.04em;opacity:.72}

/* ---- resting pose = the final frame ---- */
#s__N__ .st-squeeze-stack{transform-origin:50% 100%;transform:scaleY(.24)}
#s__N__ .st-squeeze-sheet{transform-origin:50% 50%}
#s__N__ .st-squeeze-press-sh{opacity:.07;transform-origin:50% 50%}
#s__N__ .st-squeeze-platen{transform:translateY(-30px)}
#s__N__ .st-squeeze-wheel{transform-origin:50% 50%;transform:rotate(320deg)}
#s__N__ .st-squeeze-dust{opacity:0}
#s__N__ .st-squeeze-strap{transform-origin:50% 100%}
#s__N__ .st-squeeze-label{transform-origin:50% 100%}
#s__N__ .st-squeeze-dust circle{transform-origin:50% 50%}
#s__N__ .st-squeeze-scrap{transform-origin:50% 50%}
#s__N__ .st-squeeze-s1{transform:translate(-150px,84px) rotate(-200deg)}
#s__N__ .st-squeeze-s2{transform:translate(160px,90px) rotate(170deg)}
#s__N__ .st-squeeze-s3{transform:translate(96px,12px) rotate(8deg)}

/* ---- the arrival: one 1.5 s timeline. Slide in 0–0.3 s, contact 0.45 s, squeezed 0.7 s, lift 0.7–1.0 s ---- */
#s__N__.play .st-squeeze-sheet{animation:st-squeeze-sheet 1.5s linear backwards}
#s__N__.play .st-squeeze-stack{animation:st-squeeze-stack 1.5s linear backwards}
#s__N__.play .st-squeeze-platen{animation:st-squeeze-platen 1.5s linear backwards}
#s__N__.play .st-squeeze-press-sh{animation:st-squeeze-press-sh 1.5s linear backwards}
#s__N__.play .st-squeeze-wheel{animation:st-squeeze-wheel 1.5s linear backwards}
#s__N__.play .st-squeeze-bed{animation:st-squeeze-jolt 1.5s linear backwards}
#s__N__.play .st-squeeze-dust{animation:st-squeeze-show 1.5s linear backwards}
#s__N__.play .st-squeeze-dl circle{animation:st-squeeze-puff-l 1.5s cubic-bezier(.2,.7,.3,1) backwards}
#s__N__.play .st-squeeze-dr circle{animation:st-squeeze-puff-r 1.5s cubic-bezier(.2,.7,.3,1) backwards}
#s__N__.play .st-squeeze-dust circle:nth-child(2){--dy:-24px;--k:1.6}
#s__N__.play .st-squeeze-dust circle:nth-child(3){--dy:-40px;--k:1.3;--dx:40px}
#s__N__.play .st-squeeze-dust circle:nth-child(4){--dy:6px;--k:1.2;--dx:90px}
#s__N__.play .st-squeeze-s1{animation:st-squeeze-s1 1.5s linear backwards}
#s__N__.play .st-squeeze-s2{animation:st-squeeze-s2 1.5s linear backwards}
#s__N__.play .st-squeeze-s3{animation:st-squeeze-s3 1.5s linear backwards}
#s__N__.play .st-squeeze-t1{animation:st-squeeze-strap 1.5s linear backwards}
#s__N__.play .st-squeeze-t2{animation:st-squeeze-strap 1.5s linear .06s backwards}
#s__N__.play .st-squeeze-edge{animation:st-squeeze-edge 1.5s linear backwards}
#s__N__.play .st-squeeze-label{animation:st-squeeze-label 1.5s linear backwards}
#s__N__.play .st-squeeze-big{animation:st-squeeze-land 1.5s linear backwards}
#s__N__.play .st-squeeze-was{animation:st-squeeze-was 1.5s linear backwards}
#s__N__.play .st-squeeze-was .strike{animation:strike .3s var(--ease) .98s backwards}

/* the sheets slide in from the left, the top ones lagging, so the stack leans, overshoots and rights itself;
   then the squeeze squares them up (the jitter goes to zero as the platen closes) */
@keyframes st-squeeze-sheet{
  0%{transform:translateX(calc(-700px - var(--i) * 6px)) translateX(var(--jx)) rotate(var(--r));animation-timing-function:cubic-bezier(.25,.7,.35,1)}
  14%{transform:translateX(calc(var(--i) * -2.2px)) translateX(var(--jx)) rotate(var(--r));animation-timing-function:ease-in-out}
  20%{transform:translateX(calc(var(--i) * 1.3px)) translateX(var(--jx)) rotate(var(--r));animation-timing-function:ease-in-out}
  26%,30%{transform:translateX(var(--jx)) rotate(var(--r))}
  47%{transform:translateX(calc(var(--jx) * .5)) rotate(calc(var(--r) * .3))}
  60%,100%{transform:none}}
@keyframes st-squeeze-stack{
  0%,30%{transform:none;animation-timing-function:cubic-bezier(.5,0,.6,1)}
  46.7%{transform:scaleY(.18);animation-timing-function:ease-out}
  56%{transform:scaleY(.215);animation-timing-function:ease-in-out}
  64%{transform:scaleY(.196)}
  72%,100%{transform:scaleY(.24)}}
/* platen: bottom at 150 → contact 212 (0.45 s) → 465 (0.7 s) → lifts to rest 436 */
@keyframes st-squeeze-platen{
  0%{transform:translateY(-286px);animation-timing-function:cubic-bezier(.5,0,.9,.5)}
