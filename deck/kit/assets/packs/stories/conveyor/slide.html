<!-- Story · conveyor: everything checked, one held. Parcels roll in on a belt and pass under a scanner arch; the
     beam flares as each one crosses and a teal check pops over the ones that pass; the odd one (a crate) turns the
     beam amber, gets swept by a scan line, and an amber "Hold" tag pops up on a string; the lamp on the arch
     blinks twice and stays amber. The belt slows to a stop, the parcels tip forward with the inertia, then the
     belt keeps a slow ambient crawl (treads, roller spokes). ~1.45 s, CSS only (.play) + amb- keyframes.
     Re-skin: the parcels are the product's items (orders, invoices, messages, packages); the tag says what happens
     to the odd one ("Hold", "Review", "Fraud?"). Copy: rewrite the h2 and the tag. -->
