<script>
const el = document.getElementById('s__N__'), sign = el.querySelector('.rv-neon-sign'), refl = el.querySelector('.rv-neon-refl')
// any brand colour becomes a gas: keep the hue, lift lightness and chroma in OKLCH, clip to sRGB

  const cx = document.createElement('canvas').getContext('2d')
  const rgb = s => { cx.fillStyle = '#010203'; cx.fillStyle = s.trim(); const v = cx.fillStyle; return v[0] === '#' && v !== '#010203' ? [1, 3, 5].map(i => parseInt(v.slice(i, i + 2), 16) / 255) : null }
  const lin = c => c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4, gam = c => c <= .0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - .055
  const toLab = ([r, g, b]) => { [r, g, b] = [r, g, b].map(lin); const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b); return [.2104542553 * l + .793617785 * m - .0040720468 * s, 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, .0259040371 * l + .7827717662 * m - .808675766 * s] }

const copy = document.createElement('div'), inner = sign.cloneNode(true); copy.className = 'rv-neon-copy'

Deck.clock(el, t => {
  if (mode === 'play') { const lt = performance.now() / 1000 - t0; pose(Math.min(lt, END), lt >= END ? t : null); if (lt >= END) mode = 'done' }

  steps: 1,
  set: (k, ctx) => show(k ? (ctx.animate ? 'play' : 'done') : 'empty'),
  enter: (_, ctx) => { if (ctx.from === __N__ + 1) show('done') },
  next: () => { if (mode === 'empty') { Deck.step('s__N__', 1); return true } },
  final: () => show('done'),
})
</script>
