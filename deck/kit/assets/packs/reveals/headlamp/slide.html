     Brand: --field (the sky, shaded to pre-dawn; any colour or gradient), --brand (tints the name's cream ink),
     --brand-2 (tints the first light and the land) on #s__N__. __MARK__ = stroke paths with pathLength="1" in a

<script>
const el = document.getElementById('s__N__')
const fx = el.querySelector('.rv-headlamp-fx'), beam = fx.querySelector('.beam'), spot = fx.querySelector('.spot'), lamp = fx.querySelector('.lamp'), glow = fx.querySelector('.glow')
const grad = fx.querySelector('linearGradient'), word = el.querySelector('.rv-headlamp-word'), name = el.querySelector('.rv-headlamp-name'), mist = el.querySelector('.rv-headlamp-mist')
const dawnL = el.querySelector('.rv-headlamp-dawn'), stars = el.querySelector('.rv-headlamp-stars .st'), venus = el.querySelector('.rv-headlamp-stars .venus')
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), P = (t, a, d) => clamp((t - a) / d)
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, out = p => 1 - Math.pow(1 - p, 3)
const rng = a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
const f1 = v => v.toFixed(1)
// the world, drawn once: karst towers (spires, sheer blocks, domes) with a ragged forest fringe, the canopy line,
// the rows' trunks, leaf litter on the plot floor
{
  const land = el.querySelector('.rv-headlamp-land')
  const ridge = (seed, base, hi, lo, w0, w1) => {
    const r = rng(seed); let x = -80, d = `M-80 ${base + 60}L-80 ${base}`
    while (x < 1990) {
      const w = w0 + r() * (w1 - w0), top = hi + r() * (lo - hi), k = r(), a = x, b = x + w, m = (a + b) / 2, h = base - top
      // spires: steep flanks to a narrow rounded tip; blocks: near-sheer walls under a forested cap; a few domes
      if (k < .42) d += `L${f1(a + w * .16)} ${f1(base - h * .55)}L${f1(a + w * .3)} ${f1(top + h * .22)}Q${f1(m - w * .12)} ${f1(top + 8)} ${f1(m)} ${f1(top)}Q${f1(m + w * .14)} ${f1(top + 10)} ${f1(b - w * .26)} ${f1(top + h * .3)}L${f1(b - w * .12)} ${f1(base - h * .5)}L${f1(b)} ${base}`
      else if (k < .86) d += `L${f1(a + w * .04)} ${f1(base - h * .6)}L${f1(a + w * .1)} ${f1(top + 30)}Q${f1(a + w * .16)} ${f1(top + 2)} ${f1(a + w * .36)} ${f1(top + 4)}Q${f1(m + w * .12)} ${f1(top - 8)} ${f1(b - w * .14)} ${f1(top + 14)}L${f1(b - w * .06)} ${f1(top + h * .45)}L${f1(b - w * .02)} ${base}`
      else d += `Q${f1(a + w * .05)} ${f1(top + 20)} ${f1(m)} ${f1(top)}Q${f1(b - w * .05)} ${f1(top + 20)} ${f1(b)} ${base}`
      x = b + 10 + r() * 90
    }
    return d + `L2000 ${base}L2000 ${base + 60}Z`
  }
  land.querySelector('.far').setAttribute('d', ridge(11, 640, 210, 420, 90, 200))
  land.querySelector('.near').setAttribute('d', ridge(29, 650, 330, 500, 80, 170))
  let c = 'M-20 700L-20 592', r = rng(5)
  for (let x = -20; x < 1960; x += 30 + r() * 22) c += `Q${f1(x + 14)} ${f1(560 + r() * 22)} ${f1(x + 34)} ${f1(588 + r() * 10)}`
  land.querySelector('.canopy').setAttribute('d', c + 'L1960 700Z')
  let t = ''; r = rng(8)
  for (let x = 6; x < 1920; x += 22 + r() * 12) t += `<path d="M${f1(x)} ${f1(650 + r() * 10)}L${f1(x + r() * 3 - 1.5)} 826" stroke-width="${f1(2 + r() * 2.5)}"/>`
  land.querySelector('.trunks').innerHTML = t
  let l = ''; r = rng(3)
  for (let i = 0; i < 110; i++) l += `<ellipse cx="${f1(r() * 1920)}" cy="${f1(836 + r() * 240)}" rx="${f1(3 + r() * 5)}" ry="${f1(1.2 + r() * 1.6)}" transform="rotate(${f1(r() * 40 - 20)})" transform-origin="center"/>`
  land.querySelector('.litter').innerHTML = l
  let s = ''; r = rng(17)
  for (let i = 0; i < 120; i++) { const y = r() * 560; s += `<circle cx="${f1(r() * 1920)}" cy="${f1(y)}" r="${f1(.5 + r() * r() * 1.5)}" opacity="${f1(.25 + r() * .65 * (1 - y / 900))}"/>` }
  stars.innerHTML = s
}
// near trees with a real tapping panel: faint healed cuts below, the fresh cut sloping down at about 25 degrees,
// latex along it, a spout, a cup hung on a wire, and a drop that gathers and falls
{
  const T = [[70, 66, 662, -2], [330, 42, 702, -5.5], [1420, 50, 690, -7.8]]

    g += `<path class="bark" d="M${x} ${bot}L${f1(x + (w - tw) / 2)} ${top}L${f1(x + (w + tw) / 2)} ${top}L${x + w} ${bot}Z"/>`
    for (let k = 0; k < 9; k++) g += `<ellipse class="lichen" cx="${f1(x + 8 + r() * (w - 16))}" cy="${f1(60 + r() * 900)}" rx="${f1(3 + r() * 5)}" ry="${f1(6 + r() * 12)}"/>`

    const sx = xl + 3, sy = y + drop + 8
    g += `<path class="spout" d="M${f1(sx)} ${f1(sy)}L${f1(sx - 9)} ${f1(sy + 5)}"/>`
    const cy = sy + 52
    g += `<path class="wire" d="M${x} ${f1(cy - 8)}Q${f1(x + w / 2)} ${f1(cy - 1)} ${x + w} ${f1(cy - 8)}"/>`
    g += `<path class="cup" d="M${f1(sx - 22)} ${f1(cy - 6)}L${f1(sx + 4)} ${f1(cy - 6)}L${f1(sx + 1)} ${f1(cy + 12)}L${f1(sx - 19)} ${f1(cy + 12)}Z"/><path class="cup-rim" d="M${f1(sx - 23)} ${f1(cy - 6)}L${f1(sx + 5)} ${f1(cy - 6)}"/>`
    g += `<ellipse class="drop" cx="${f1(sx - 9)}" cy="${f1(sy + 7)}" rx="2.4" ry="3.2" style="--dl:${dl}s;--fall:${f1(cy - sy - 14)}px"/>`
    if (i === 2) cut = [(xr + xl) / 2, y + drop / 2]

}
var cut
const L = [1351, 802], END = 2.3
for (const ch of el.getAttribute('aria-label')) { const b = document.createElement('b'); b.textContent = ch; name.appendChild(b) }
const letters = [...name.children], marks = [...el.querySelectorAll('.rv-headlamp-word .mark > *')]
let lx = null, wl = 0, wy = 478
// long names shrink so mark + name fit 1640 px; then the letters' centres for the beam
const measure = () => {
  el.style.removeProperty('--hl-fs')
  const fs = 212, mw = fs * .83 + fs * .19, w = mw + name.offsetWidth
