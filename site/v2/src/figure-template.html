<style>
__FONTS__
__TOKENS(.rp2-fig)__
.rp2-fig{background:var(--rp-paper);padding:72px 32px 0}
.rp2-fig .in{max-width:760px;margin:0 auto}
.rp2-fig h1{font-size:clamp(20px,2vw,24px);line-height:1.3;letter-spacing:-.02em;font-weight:500;margin:0;text-wrap:balance;color:var(--rp-quiet)}
.rp2-fig .rp2-answer{margin:20px 0 0;font-size:clamp(40px,5.2vw,64px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance;font-variant-numeric:tabular-nums}
.rp2-fig .rp2-answer strong{font-weight:600;display:block}
.rp2-fig .rp2-answer span{font-weight:450;color:var(--rp-dim);font-size:.36em;letter-spacing:-.015em;display:block;margin-top:14px}
.rp2-fig .rp2-dates{margin:12px 0 0;font-size:14px;color:var(--rp-dim);font-variant-numeric:tabular-nums}
.rp2-fig .rp2-chart{margin:36px 0 0;padding:28px 28px 20px;background:#fff;border-radius:12px;position:relative;box-shadow:var(--rp-shadow)}
.rp2-fig .rp2-step.narrow{display:none}
.rp2-fig .rp2-slide{margin:28px 0 0;padding:16px 20px;border-radius:10px;background:var(--rp-red-wash);box-shadow:inset 0 0 0 1px rgba(201,58,27,.2);font-size:18px;line-height:1.45;font-weight:500;letter-spacing:-.015em}
.rp2-fig .rp2-slide span{display:block;color:var(--rp-red);font-size:13px;font-weight:600;letter-spacing:-.005em;margin-bottom:4px}
.rp2-fig .rp2-rel{margin:48px 0 0;width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.rp2-fig .rp2-rel caption{text-align:left;font-size:15px;font-weight:600;padding-bottom:12px;caption-side:top}
.rp2-fig .rp2-rel th{text-align:left;font-weight:500;font-size:12px;color:var(--rp-dim);padding:0 12px 8px 0;border-bottom:1px solid var(--rp-line2)}
.rp2-fig .rp2-rel td{padding:0 12px 0 0;height:44px;border-bottom:1px solid var(--rp-line);color:var(--rp-quiet)}
.rp2-fig .rp2-rel td:nth-child(2){color:var(--rp-ink);font-weight:600}
.rp2-fig .rp2-rel :is(th,td):last-child{text-align:right;padding-right:0}
.rp2-fig .rp2-rel tr.chg td:last-child{color:var(--rp-ink)}
.rp2-fig .rp2-rel a,.rp2-fig .rp2-source a{color:var(--rp-quiet);text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:rgba(17,17,16,.25)}
.rp2-fig .rp2-rel a{display:inline-block;padding:12px 0}
.rp2-fig .rp2-rel small{display:none}
.rp2-fig .rp2-source{margin:20px 0 0;font-size:13px;color:var(--rp-dim)}
.rp2-fig .end{margin:96px 0 0;padding-bottom:112px}
.rp2-fig .end .h2{font-size:clamp(28px,3vw,36px)}
@media (hover:hover){.rp2-fig .rp2-rel a:hover,.rp2-fig .rp2-source a:hover{color:var(--rp-ink)}}
@media (prefers-reduced-motion:no-preference){.rp2-fig .rp2-step :is(.jump.w,.lv){animation:rp3f-fade .5s var(--rp-ease) .5s both}}
@keyframes rp3f-fade{from{opacity:0}to{opacity:1}}
@media (max-width:720px){
  .rp2-fig{padding:40px 16px 0}
  .rp2-fig .rp2-chart{padding:16px 12px 10px;margin-top:28px}
  .rp2-fig .rp2-step.wide{display:none}.rp2-fig .rp2-step.narrow{display:block}
  .rp2-fig .rp2-slide{font-size:17px;padding:14px 16px}
  .rp2-fig .rp2-rel{font-size:13px}
  .rp2-fig .rp2-rel :is(th,td):first-child{white-space:nowrap}
  .rp2-fig .rp2-rel td:nth-child(3){font-size:12.5px;line-height:1.3}
  .rp2-fig .rp2-rel a{padding:13px 0}
  .rp2-fig .end{margin-top:72px;padding-bottom:80px}
}
@media (max-width:480px){
  .rp2-fig .rp2-rel :is(th,td):first-child{display:none}
  .rp2-fig .rp2-rel td{height:auto;vertical-align:top;padding-top:10px;padding-bottom:10px}
  .rp2-fig .rp2-rel td:nth-child(3){padding:0 12px 0 0}
  .rp2-fig .rp2-rel td:nth-child(3) a>span{text-decoration:underline}
  .rp2-fig .rp2-rel td:nth-child(3) a{display:block;padding:10px 0;min-height:44px;text-decoration:none}
  .rp2-fig .rp2-rel small{display:block;margin-top:2px;font-size:12px;color:var(--rp-dim)}
}
</style>
<article class="rp2-fig">
  <div class="in">
    <h1>{{title}}</h1>
    {{body_html}}
    <div class="end">
      <div><h2 class="h2">Quoted this figure?</h2><p class="sub">Send the deck. We tell you when it changes.</p></div>
      <a class="b1" href="/cover-my-briefing/">Send a deck</a>
    </div>
  </div>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"QAPage","mainEntity":{"@type":"Question","name":"{{title}}","acceptedAnswer":{"@type":"Answer","text":"{{answer}}"}}}</script>
</article>
