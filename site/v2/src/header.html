<style>
__FONTS__
__TOKENS(.rp2-head)__
.rp2-head{background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--rp-line)}
.rp2-head .in{max-width:1216px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.rp2-head .mark{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--rp-ink);text-decoration:none;min-height:44px}
.rp2-head nav{display:flex;align-items:center;gap:4px}
.rp2-head nav a{color:var(--rp-quiet);text-decoration:none;font-size:14px;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;transition:color .15s}
.rp2-head nav a.btn{margin-left:12px;padding:0 14px;color:#fff;font-weight:550;position:relative;isolation:isolate}
.rp2-head nav a.btn::before{content:"";position:absolute;inset:4px 0;border-radius:9px;background:var(--rp-ink);z-index:-1;transition:background-color .15s}
/* on the Send page the button is the current page: pressed, not a call to action */
body:has(.rp2-cover) .rp2-head nav a.btn{color:var(--rp-ink)}
body:has(.rp2-cover) .rp2-head nav a.btn::before{background:var(--rp-bg2);box-shadow:inset 0 0 0 1px var(--rp-line2)}
@media (hover:hover){.rp2-head nav a:not(.btn):hover{color:var(--rp-ink)}.rp2-head nav a.btn:hover::before{background:#2A2926}}
/* phones: a small menu (details/summary, no script) keeps the three links; the button stays visible */
.rp2-head .menu{display:none;position:relative}
.rp2-head .menu summary{list-style:none;display:grid;place-items:center;width:44px;height:44px;margin-right:-10px;border-radius:9px;color:var(--rp-ink);cursor:pointer}
.rp2-head .menu summary::-webkit-details-marker{display:none}
.rp2-head .menu[open] summary .o,.rp2-head .menu:not([open]) summary .c{display:none}
.rp2-head .menu .pop{position:absolute;right:-6px;top:50px;min-width:208px;padding:6px;display:grid;background:#fff;border-radius:12px;box-shadow:var(--rp-shadow)}
.rp2-head .menu .pop a{color:var(--rp-ink);font-size:15px;border-radius:8px}
@media (hover:hover){.rp2-head .menu .pop a:hover{background:var(--rp-bg2)}}
@media (max-width:720px){.rp2-head .in{padding:0 16px;height:56px}.rp2-head nav a.x{display:none}.rp2-head .menu{display:block}.rp2-head nav a.btn{margin-left:0}}
</style>
<header class="rp2-head">
  <div class="in">
    <a class="mark" href="/" aria-label="Recall Press home"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="6" fill="#111110"/><path d="M5 8h10M5 12.5h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M4 9.6 16 6.2" stroke="#E2502E" stroke-width="2" stroke-linecap="round"/></svg>Recall Press</a>
    <nav aria-label="Main">
      <a class="x" href="/how-corrections-work/">How it works</a>
      <a class="x" href="/indicators/">Figures</a>
      <a class="x" href="/about/">About</a>
      <a class="btn" href="/cover-my-briefing/">Send a deck</a>
      <details class="menu"><summary aria-label="Menu"><svg class="o" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 6h12M3 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><svg class="c" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m4.5 4.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></summary>
        <div class="pop"><a href="/how-corrections-work/">How it works</a><a href="/indicators/">Figures</a><a href="/about/">About</a></div>
      </details>
    </nav>
  </div>
</header>
