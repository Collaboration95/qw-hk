name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check map viewports in headless Chrome
        run: |
          PYTHONPATH=. python tests/test_hardening_map.py "$RUNNER_TEMP/maps"
          # Keep the content viewport at the requested width on Linux.
          cat > "$RUNNER_TEMP/chrome" <<'SH'
          #!/bin/sh
          exec google-chrome --hide-scrollbars "$@"
          SH
          chmod +x "$RUNNER_TEMP/chrome"
          CHROME="$RUNNER_TEMP/chrome" node tests/map_viewports.mjs "$RUNNER_TEMP/maps"
      - name: Replay samples and verify corrected slide 4
        shell: python
        run: |
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from pptx import Presentation

          sys.path.insert(0, str(Path.cwd()))
          from demo import run_demo

          with TemporaryDirectory() as temp:
              project = Path(temp)
              runs = {day: result for day, _, result in run_demo(project)}
              claim, = (v for v in runs["2025-11-21"]["verdicts"]
                        if v["claim_id"] == "members-briefing-2025q3-c2")
              deck = Presentation(project / "workspace" / claim["replacement_file"])
              text = "\n".join(shape.text for shape in deck.slides[3].shapes if shape.has_text_frame)
              assert "grew" in text, text
